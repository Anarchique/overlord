<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="page-hero">
    <span class="eyebrow">L'équipe</span>
    <h1>Les Membres</h1>
    <p>Les visages derrière Overlord. Filtre par rang pour trouver qui est qui.</p>
  </header>

  <section style="padding-top:20px">
    <div class="filters">
      <button class="filter active" data-filter="all">Tous</button>
      <button class="filter" data-filter="Overlord">Overlord</button>
      <button class="filter" data-filter="Gardien de Stratum">Gardien de Stratum</button>
      <button class="filter" data-filter="Pléiade">Pléiade</button>
      <button class="filter" data-filter="Chinois Vénimeux">Chinois Vénimeux</button>
      <button class="filter" data-filter="Chevalier de Death">Chevalier de Death</button>
      <button class="filter" data-filter="Légionnaire Sombre">Légionnaire Sombre</button>
      <button class="filter" data-filter="Initié du Tombeau">Initié du Tombeau</button>
    </div>
    <div class="grid g4" id="grid"></div>
  </section>
</main>
<script src="main.js"></script>
<script>
  // Modifie cette liste : pseudo Minecraft exact (pour la tête), nom affiché, tag Discord, rôle, statut
  const members = [
    { mc: 'Anarchique_',       name: 'Anarchique',   tag: '@3i2e',  role: 'Overlord',     status: 'on' },
    { mc: '', name: '',      tag: '',    role: '', status: 'on' },
    { mc: '',       name: '',   tag: '',     role: '', status: 'idle' },
    { mc: '',        name: '',    tag: '',  role: '', status: 'on' },
    { mc: '',       name: '',     tag: '',   role: '',   status: 'off' },
    { mc: '',       name: '',    tag: '',  role: '',   status: 'on' },
    { mc: '',      name: '',     tag: '',   role: '',   status: 'idle' },
    { mc: '',  name: '',    tag: '',  role: '',   status: 'on' },
    { mc: '',       name: '',   tag: '',    role: '',   status: 'on' },
    { mc: '',        name: '',      tag: '',    role: '',   status: 'off' },
  ];
  const labels = { Overlord: 'Overlord', 'Gardien de Stratum': 'Gardien de Stratum', 'Pléiade': 'Pléiade', 'Chinois Vénimeux': 'Chinois Vénimeux', 'Chevalier de Death': 'Chevalier de Death', 'Légionnaire Sombre': 'Légionnaire Sombre', 'Initié du Tombeau': 'Initié du Tombeau', recrue: 'Recrue' };
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c]));

  document.getElementById('grid').innerHTML = members.map(m => `
    <div class="card member reveal" data-tilt data-role="${m.role}">
      <div class="avatar">
        <img src="https://mc-heads.net/avatar/${encodeURIComponent(m.mc)}/128" alt="Tête de ${esc(m.mc)}" loading="lazy">
        <span class="status ${m.status}"></span>
      </div>
      <h3>${esc(m.name)}</h3>
      <div class="tagd">${esc(m.tag)}</div>
      <span class="role ${m.role}">${labels[m.role]}</span>
    </div>`).join('');
</script>

</body>
