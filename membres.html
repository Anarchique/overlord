<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membres — Overlord</title>
<!-- Réseaux sociaux : remplacer VOTRE-DOMAINE.fr par l’URL réelle du site. -->
<meta name="description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Overlord">
<meta property="og:title" content="Membres — Overlord">
<meta property="og:description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">
<meta property="og:image" content="https://VOTRE-DOMAINE.fr/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://VOTRE-DOMAINE.fr/membres.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Membres — Overlord">
<meta name="twitter:description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">
<meta name="twitter:image" content="https://VOTRE-DOMAINE.fr/assets/og-image.png">
<meta name="theme-color" content="#9d4dff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="page-hero">
    <span class="eyebrow">L'équipe</span>
    <h1>Les Membres</h1>
    <p>Les visages derrière Overlord. Filtre par rang pour trouver qui est qui.</p>
  </header>

  <section style="padding-top:20px">
    <div class="filters">
      <button class="filter active" data-filter="all">Tous</button>
      <button class="filter" data-filter="Overlord">Overlord</button>
      <button class="filter" data-filter="Gardien de Stratum">Gardien de Stratum</button>
      <button class="filter" data-filter="Pléiade">Pléiade</button>
      <button class="filter" data-filter="Chinois Vénimeux">Chinois Vénimeux</button>
      <button class="filter" data-filter="Chevalier de Death">Chevalier de Death</button>
      <button class="filter" data-filter="Légionnaire Sombre">Légionnaire Sombre</button>
      <button class="filter" data-filter="Initié du Tombeau">Initié du Tombeau</button>
    </div>
    <div class="grid g4" id="grid"></div>
  </section>
</main>
<script>
  // Pseudo Minecraft exact (tête du skin), nom affiché, tag Discord, rôle, statut (on | idle | off)
  // Défini avant main.js pour que les cartes existent quand main.js initialise filtres / tilt / reveal
  const members = [
    { mc: 'Anarchique_', name: 'Anarchique', tag: '@3i2e',       role: 'Overlord',           status: 'on' },
    { mc: 'HanTy14',     name: 'HanTy14',    tag: '@hanty1444_', role: 'Gardien de Stratum', status: 'on' },
    { mc: 'SWHOOK',      name: 'SWHOOK',     tag: '@swidow',     role: 'Pléiade',            status: 'on' },
    { mc: 'wcodein',     name: 'wcodein',    tag: '@5tgl',       role: 'Chinois Vénimeux',   status: 'on' },
  ];

  const labels = {
    Overlord: 'Overlord', 'Gardien de Stratum': 'Gardien de Stratum', 'Pléiade': 'Pléiade',
    'Chinois Vénimeux': 'Chinois Vénimeux', 'Chevalier de Death': 'Chevalier de Death',
    'Légionnaire Sombre': 'Légionnaire Sombre', 'Initié du Tombeau': 'Initié du Tombeau', recrue: 'Recrue'
  };

  // Échappement HTML (texte et attributs)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // Sources de têtes (pseudo MC -> image), essayées dans l'ordre, puis Steve en dernier recours
  const HEAD_SOURCES = [
    p => `https://mc-heads.net/avatar/${p}/128`,
    p => `https://minotar.net/helm/${p}/128.png`,
    p => `https://crafatar.com/avatars/${p}?size=128&overlay`,
  ];
  const FALLBACK = 'https://mc-heads.net/avatar/MHF_Steve/128';

  // Passe à la source suivante si l'image échoue
  function nextHead(img) {
    const i = +img.dataset.src + 1;
    img.dataset.src = i;
    img.src = i < HEAD_SOURCES.length ? HEAD_SOURCES[i](img.dataset.mc) : FALLBACK;
    if (i >= HEAD_SOURCES.length) img.onerror = null;
  }

  const card = m => {
    const pseudo = encodeURIComponent(m.mc.trim());
    const role = esc(m.role);
    return `
    <div class="card member reveal" data-tilt data-role="${role}">
      <a class="avatar" href="https://namemc.com/profile/${pseudo}" target="_blank" rel="noopener" title="Profil NameMC de ${esc(m.mc)}">
        <img src="${HEAD_SOURCES[0](pseudo)}" data-mc="${pseudo}" data-src="0"
             alt="Tête de ${esc(m.mc)}" loading="lazy" style="image-rendering:pixelated"
             onerror="nextHead(this)">
        <span class="status ${esc(m.status)}"></span>
      </a>
      <h3>${esc(m.name || m.mc)}</h3>
      <div class="tagd">${esc(m.tag)}</div>
      <span class="role ${role}">${esc(labels[m.role] || m.role)}</span>
    </div>`;
  };

  // Rendu immédiat de la grille (le DOM de #grid est déjà parsé ici)
  document.getElementById('grid').innerHTML = members
    .filter(m => m.mc && m.mc.trim())
    .map(card).join('');
</script>
<script src="main.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
