<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membres — Overlord</title>
<!-- Réseaux sociaux : remplacer VOTRE-DOMAINE.fr par l’URL réelle du site. -->
<meta name="description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">
<meta property="og:type" content="website">

<meta property="og:description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">

<meta name="twitter:title" content="Membres — Overlord">
<meta name="twitter:description" content="Découvrez les membres et les rangs de la faction Overlord Minecraft.">
<meta name="twitter:image" content="https://VOTRE-DOMAINE.fr/assets/og-image.png">
<meta name="theme-color" content="#9d4dff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
<style>
  /* L'avatar est un <a> (inline par défaut) : on force la taille fixe 104x104 */
  a.avatar{display:block;position:relative;width:104px;height:104px;margin:0 auto;flex:none}
  .member .avatar img{display:block;width:104px;height:104px;max-width:none;object-fit:cover;image-rendering:pixelated}
  .member{display:flex;flex-direction:column;align-items:center}

  /* Badges par rang (ciblés via data-role, les noms contiennent des espaces) */
  .member .role{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--glass-b)}
  .member[data-role="Overlord"] .role{background:rgba(245,197,66,.15);color:var(--gold);border-color:rgba(245,197,66,.45);box-shadow:0 0 15px rgba(245,197,66,.25)}
  .member[data-role="Gardien de Stratum"] .role{background:rgba(157,77,255,.18);color:var(--violet-2);border-color:rgba(157,77,255,.5)}
  .member[data-role="Pléiade"] .role{background:rgba(88,101,242,.15);color:#a5b0ff;border-color:rgba(88,101,242,.4)}
  .member[data-role="Chinois Vénimeux"] .role{background:rgba(59,165,93,.15);color:#7ee2a0;border-color:rgba(59,165,93,.45)}
  .member[data-role="Chevalier de Death"] .role{background:rgba(255,77,109,.15);color:#ff8fa3;border-color:rgba(255,77,109,.45)}
  .member[data-role="Légionnaire Sombre"] .role{background:rgba(124,45,18,.25);color:#f0a37a;border-color:rgba(240,163,122,.4)}
</style>
</head>
<body>
<main>
  <header class="page-hero">
    <span class="eyebrow">L'équipe</span>
    <h1>Les Membres</h1>
    <p>Les visages derrière Overlord. Filtre par rang pour trouver qui est qui.</p>
  </header>

  <section style="padding-top:20px">
    <div class="filters">
      <button class="filter active" data-filter="all">Tous</button>
      <button class="filter" data-filter="Overlord">Overlord</button>
      <button class="filter" data-filter="Gardien de Stratum">Gardien de Stratum</button>
      <button class="filter" data-filter="Pléiade">Pléiade</button>
      <button class="filter" data-filter="Chinois Vénimeux">Chinois Vénimeux</button>
      <button class="filter" data-filter="Chevalier de Death">Chevalier de Death</button>
      <button class="filter" data-filter="Légionnaire Sombre">Légionnaire Sombre</button>
      <button class="filter" data-filter="Initié du Tombeau">Initié du Tombeau</button>
    </div>
    <div class="grid g4" id="grid"></div>
  </section>
</main>
<script>
  // Pseudo Minecraft, UUID Mojang (plus fiable que le pseudo), nom affiché, tag Discord, rôle, statut (on | idle | off)
  // Défini avant main.js pour que les cartes existent quand main.js initialise filtres / tilt / reveal
  const members = [
    { mc: 'Anarchique_', uuid: '78237e3318a74a7c88834670473f483d', name: 'Anarchique', tag: '@3i2e',           role: 'Overlord',           status: 'on' },
    { mc: 'Zewoofr',     uuid: 'ccbe35c712f94c9f908d3057019314b2', name: 'Zewoo',      tag: '@zewofr',         role: 'Overlord',           status: 'on' },
    { mc: 'SucreGlace',  uuid: '272e2831fb3347fa911724bcfe6b69ae', name: 'SucreGlace', tag: '@fan_2_nai',      role: 'Gardien de Stratum', status: 'on' },
    { mc: 'HanTy14',     uuid: 'da98c434453d420bb812390307e440f2', name: 'HanTy14',    tag: '@hanty1444_',     role: 'Gardien de Stratum', status: 'on' },
    { mc: 'SWHOOK',      uuid: '65c570a7033f42888dcd1a87721f683d', name: 'SWHOOK',     tag: '@swidow',         role: 'Pléiade',            status: 'on' },
    { mc: 'Wcodein',     uuid: '2aba46c8b1d44e38a166de9eda2005f3', name: 'wcodein',    tag: '@5tgl',           role: 'Chinois Vénimeux',   status: 'on' },
    { mc: 'WhiteScam',                                              name: 'WhiteScam',  tag: '@alvaroooo0669',  role: 'Chevalier de Death', status: 'on' },
    { mc: '_IPA12',      uuid: '2b935195a6504510b5c97dcddc6a12af', name: 'IPA',        tag: '@fan_2_nai',      role: 'Légionnaire Sombre', status: 'on' },
    { mc: 'NaGaZaKi_0',  uuid: 'b4e54ff40c44442084e461f54370df1f', name: 'NaGaZaKi',   tag: '@raphael_100807', role: 'Légionnaire Sombre', status: 'on' },
    { mc: 'romsteek',    uuid: '48e3c69aaa8647ff98429e533a979753', name: 'romsteek',   tag: '@romsteek',       role: 'Légionnaire Sombre', status: 'on' },
  ];

  const labels = {
    Overlord: 'Overlord', 'Gardien de Stratum': 'Gardien de Stratum', 'Pléiade': 'Pléiade',
    'Chinois Vénimeux': 'Chinois Vénimeux', 'Chevalier de Death': 'Chevalier de Death',
    'Légionnaire Sombre': 'Légionnaire Sombre', 'Initié du Tombeau': 'Initié du Tombeau', recrue: 'Recrue'
  };

  // Échappement HTML (texte et attributs)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const cleanUuid = m => (m.uuid || '').replace(/-/g, '').trim();

  // Sources d'images de secours (utilisées si le rendu depuis la texture échoue)
  const FALLBACK = 'https://minotar.net/helm/MHF_Steve/104.png';
  const headSources = m => {
    const p = encodeURIComponent(m.mc.trim());
    const u = cleanUuid(m);
    const id = u || p;
    return [
      `https://vzge.me/face/104/${id}.png`,
      `https://starlightskins.lunareclipse.studio/render/pixel/${id}/face`,
      `https://api.mineatar.io/face/${id}?scale=13&overlay=true`,
      `https://crafatar.com/avatars/${u || p}?size=104&overlay`,
      `https://minotar.net/helm/${id}/104.png`,
      FALLBACK
    ];
  };

  // Passe à la source suivante si l'image échoue
  function nextHead(img) {
    const list = img.dataset.list.split('|');
    const i = +img.dataset.src + 1;
    if (i >= list.length) { img.onerror = null; return; }
    img.dataset.src = i;
    img.src = list[i];
  }

  // Charge une image (CORS autorisé) et la résout
  const loadImg = src => new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });

  // Récupère la texture du skin (PNG 64x64) via des API compatibles CORS
  async function getSkin(m) {
    const id = cleanUuid(m) || m.mc.trim();
    // 1) Ashcon : renvoie la texture en base64 (pas de souci CORS)
    try {
      const r = await fetch(`https://api.ashcon.app/mojang/v2/user/${encodeURIComponent(id)}`);
      if (r.ok) {
        const d = await r.json();
        const b64 = d?.textures?.skin?.data;
        if (b64) return await loadImg(`data:image/png;base64,${b64}`);
      }
    } catch (e) { /* source suivante */ }
    // 2) Textures brutes via services de skin
    for (const url of [
      `https://minotar.net/skin/${encodeURIComponent(id)}`,
      `https://mc-heads.net/skin/${encodeURIComponent(id)}`
    ]) {
      try { return await loadImg(url); } catch (e) { /* suivante */ }
    }
    throw new Error('skin introuvable');
  }

  // Dessine la tête (face 8x8 + calque chapeau) à partir de la texture du skin
  async function renderHead(img, m) {
    try {
      const skin = await getSkin(m);
      const c = document.createElement('canvas');
      c.width = c.height = 104;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(skin, 8, 8, 8, 8, 0, 0, 104, 104);   // visage
      ctx.drawImage(skin, 40, 8, 8, 8, 0, 0, 104, 104);  // calque (chapeau)
      img.onerror = null;
      img.src = c.toDataURL('image/png');
    } catch (e) {
      // Échec : on garde la chaîne d'images de secours
    }
  }

  const card = (m, idx) => {
    const pseudo = encodeURIComponent(m.mc.trim());
    const role = esc(m.role);
    const list = headSources(m);
    return `
    <div class="card member reveal" data-tilt data-role="${role}">
      <a class="avatar" href="https://namemc.com/profile/${pseudo}" target="_blank" rel="noopener" title="Profil NameMC de ${esc(m.mc)}">
        <img src="${list[0]}" data-list="${esc(list.join('|'))}" data-src="0" data-idx="${idx}"
             width="104" height="104" alt="Tête de ${esc(m.mc)}" referrerpolicy="no-referrer"
             onerror="nextHead(this)">
        <span class="status ${esc(m.status)}"></span>
      </a>
      <h3>${esc(m.name || m.mc)}</h3>
      <div class="tagd">${esc(m.tag)}</div>
      <span class="role">${esc(labels[m.role] || m.role)}</span>
    </div>`;
  };

  // Rendu immédiat de la grille (le DOM de #grid est déjà parsé ici)
  const shown = members.filter(m => m.mc && m.mc.trim());
  document.getElementById('grid').innerHTML = shown.map(card).join('');

  // Remplace chaque tête par le rendu exact depuis la texture du skin
  document.querySelectorAll('#grid img[data-idx]').forEach(img => {
    renderHead(img, shown[+img.dataset.idx]);
  });
</script>
<script src="main.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
